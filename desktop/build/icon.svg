<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Homecoming's icon: the welcome page's house on its orange tile, laid out on Apple's 1024 grid (824 tile, 100 margin). -->
  <defs>
    <linearGradient id="tile" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffb340"/>
      <stop offset="0.5" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#ff5e3a"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#7a2a00" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
  <g transform="translate(512 532) scale(23) translate(-12 -12)" fill="none" stroke="#fff" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.8 11.4 12 4.4l8.2 7"/>
    <path d="M6.2 9.6v9.9h11.6V9.6"/>
    <path d="M10 19.5v-5.2h4v5.2"/>
  </g>
</svg>
